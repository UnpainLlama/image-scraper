name: Recover archived scraper source

on:
  push:
    branches:
      - rebuild/typescript-terminal-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source:
          - scraper/main.py
          - scraper/downloader.py
          - scraper/pagination.py
          - scraper/urlparse_target.py
          - scraper/sites/sexcom.py
          - scraper/sites/rule34.py
          - scraper/sites/realbooru.py
          - scraper/sites/elitebabes.py
          - scraper/sites/buondua.py
          - scraper/sites/static_site.py
          - scraper/static_html.py
          - scraper/session.py
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct archived Python source
        run: |
          python - <<'PY'
          import base64, glob, zipfile, io
          parts = sorted(glob.glob("pscraper/python/archive-parts/*.b64.*"))
          archive = base64.b64decode("".join(open(path).read().strip() for path in parts))
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              zipped.extractall("/tmp/pscraper-source")
          PY
      - name: Print ${{ matrix.source }}
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          echo "===== SOURCE: ${SOURCE} ====="
          cat "/tmp/pscraper-source/${SOURCE}"
