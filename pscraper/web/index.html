<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex,nofollow">
  <title>pscraper</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="login-screen" class="login-screen" aria-label="Unlock pscraper">
    <form id="login-form" class="login-form" autocomplete="on">
      <input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required minlength="15" maxlength="256" aria-label="Password" autofocus>
      <p id="login-error" class="login-error" role="status" aria-live="polite"></p>
    </form>
  </main>

  <main id="terminal-screen" class="terminal-screen" hidden>
    <section class="terminal-window" aria-label="pscraper terminal">
      <pre id="terminal-output" class="terminal-output" aria-live="polite" aria-label="Terminal output"></pre>
      <form id="terminal-form" class="terminal-input-row" autocomplete="off">
        <span class="input-caret" aria-hidden="true">&gt;</span>
        <input id="terminal-input" class="terminal-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Terminal input" placeholder="">
      </form>
      <div id="terminal-state" class="terminal-state" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
